<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neco guitar</title>
    <style>
        /* 全体の基本スタイル */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f5f0;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            color: #4a4a4a;
            margin-bottom: 1.5rem;
        }

        /* 1. 上半分のメイン画像エリア（元々の大きなイラスト表示部） */
        .main-hero {
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 停止時のメイン画像 */
        .main-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 再生時のスライドショー容器 */
        .slideshow-gallery {
            display: none; /* 初期状態は非表示 */
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slideshow-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slideshow-item.active {
            opacity: 1;
        }

        .slideshow-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* 2. 音楽プレイヤーエリア */
        .music-player {
            background: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        /* 3. 下半分のサムネイルギャラリー（横スクロール） */
        .static-gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            width: 100%;
            max-width: 800px;
            padding-bottom: 10px;
        }

        .gallery-item img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>neco guitar</h1>

    <!-- 上半分のメインビジュアルエリア -->
    <div class="main-hero">
        <!-- 音楽停止時に表示される代表画像 (logo002.jpg) -->
        <img id="mainStaticImg" class="main-hero-img" src="logo002.jpg" alt="neco guitar main">
        
        <!-- 音楽再生時に切り替わるスライドショー -->
        <div id="slideshowGallery" class="slideshow-gallery"></div>
    </div>

    <!-- 音楽プレイヤー -->
    <section class="music-player">
        <p>Tonight's Acoustic Song</p>
        <audio id="bgm" controls style="width: 100%;">
            <source src="music.mp3" type="audio/mpeg">
            お使いのブラウザは音声再生に対応していません。
        </audio>
    </section>

    <!-- 下半分のサムネイルギャラリー一覧 -->
    <div id="staticGallery" class="static-gallery"></div>

    <!-- JavaScript処理 -->
    <script>
        const audio = document.getElementById('bgm');
        const mainStaticImg = document.getElementById('mainStaticImg');
        const staticGallery = document.getElementById('staticGallery');
        const slideshowGallery = document.getElementById('slideshowGallery');
        
        let slideIndex = 0;
        let slideTimer = null;

        // 画像が存在するか確認する関数
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // 1. 初期ロード時：下の小さなギャラリー一覧を読み込む
        async function loadInitialGallery() {
            staticGallery.innerHTML = '';
            let index = 2;
            let hasMore = true;

            while (hasMore) {
                const numStr = String(index).padStart(3, '0');
                const rawUrl = `logo${numStr}.jpg`;

                const exists = await checkImageExists(rawUrl);
                if (exists) {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `<img src="${rawUrl}" alt="neco guitar logo ${index}">`;
                    staticGallery.appendChild(item);
                    index++;
                } else {
                    hasMore = false;
                }
            }
        }

        // 2. 再生ボタン押下時：キャッシュをクリアして上部のスライドショーを読み込む
        async function loadImagesWithCacheBuster() {
            slideshowGallery.innerHTML = '';
            let index = 2;
            let hasMore = true;
            const timestamp = new Date().getTime(); // キャッシュ回避タイムスタンプ

            while (hasMore) {
                const numStr = String(index).padStart(3, '0');
                const rawUrl = `logo${numStr}.jpg`;
                const cacheBustUrl = `${rawUrl}?t=${timestamp}`;

                const exists = await checkImageExists(cacheBustUrl);

                if (exists) {
                    const slideItem = document.createElement('div');
                    slideItem.className = 'slideshow-item';
                    slideItem.innerHTML = `<img src="${cacheBustUrl}" alt="neco guitar logo ${index}">`;
                    slideshowGallery.appendChild(slideItem);
                    index++;
                } else {
                    hasMore = false;
                }
            }

            const firstSlide = slideshowGallery.querySelector('.slideshow-item');
            if (firstSlide) {
                firstSlide.classList.add('active');
            }
        }

        // スライド切り替え処理
        function nextSlide() {
            const slides = slideshowGallery.querySelectorAll('.slideshow-item');
            if (slides.length <= 1) return;

            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
        }

        // 音楽再生時の処理（メイン画像をスライドショーに切り替え）
        audio.addEventListener('play', async () => {
            slideIndex = 0;

            // 最新画像をキャッシュ無視で取得
            await loadImagesWithCacheBuster();

            mainStaticImg.style.display = 'none';
            slideshowGallery.style.display = 'block';

            if (slideTimer) clearInterval(slideTimer);
            slideTimer = setInterval(nextSlide, 4000);
        });

        // 音楽停止・終了時の処理（メイン画像に戻す）
        audio.addEventListener('pause', stopSlideshow);
        audio.addEventListener('ended', stopSlideshow);

        function stopSlideshow() {
            if (slideTimer) clearInterval(slideTimer);
            slideshowGallery.style.display = 'none';
            mainStaticImg.style.display = 'block';
        }

        // 初期実行
        window.addEventListener('DOMContentLoaded', () => {
            loadInitialGallery();
        });
    </script>
</body>
</html>
